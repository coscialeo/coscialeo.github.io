<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="{{ '/headshot.jpg' | relative_url }}" as="image">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <section class="page-header">
      <div class="header-container">
        
        <img src="{{ '/headshot.jpg' | relative_url }}" alt="Profile Picture" class="header-profile-img" width="140" height="140" decoding="sync">
        
        <div class="header-text">
          <h1 class="project-name">{{ site.title | default: "Leonardo Coscia" }}</h1>
          <h2 class="project-tagline">{{ site.description | default: "PhD candidate | Scuola Normale Superiore" }}</h2>
          
          <a href="/" class="btn">Home</a>
          <a href="/research" class="btn">Research</a>
          <a href="/notes" class="btn">Notes</a>
          <a href="/other" class="btn">Other</a>
          <a href="/cv.pdf" class="btn">CV</a>
        </div>

      </div>
    </section>

    <section class="main-content">
      {{ content }}
    </section>
  </body>
</html>
