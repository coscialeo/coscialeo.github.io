<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <section class="page-header">
      <div class="header-container">
        
        <img src="/headshot.jpg" alt="Profile Picture" class="header-profile-img">
        
        <div class="header-text">
          <h1 class="project-name">{{ site.title | default: "Prof. Alex Mercer" }}</h1>
          <h2 class="project-tagline">{{ site.description | default: "Department of Physics" }}</h2>
          
          <!-- New wrapper to force button size and alignment -->
          <div class="header-buttons">
            <a href="/" class="btn">Home</a>
            <a href="/research" class="btn">Research</a>
            <a href="/notes" class="btn">Lecture Notes</a>
            <a href="/cv.pdf" class="btn">CV</a>
          </div>
        </div>

      </div>
    </section>

    <section class="main-content">
      {{ content }}
    </section>
  </body>
</html>
